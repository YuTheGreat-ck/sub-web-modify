name: Docker Publish

on:
  push:
    branches: [ "master", "main" ] # 当你向这些分支推送代码时触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2 # 支持多架构构建 (ARM64)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 关键：同时构建 amd64 和 arm64(针对你的盒子) 镜像
          platforms: linux/amd64,linux/arm64 
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sub-web-modify:latest
